name: food_safety_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/foods/
    - assets/images/foods/vegetables/
    - assets/images/foods/fruits/
    - assets/images/foods/dry_fruits/
    - assets/images/foods/protein/
